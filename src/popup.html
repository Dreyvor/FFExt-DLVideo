<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VideoDL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" alt="">
      <h1>VideoDL</h1>
    </header>
    <main id="content" aria-live="polite">
      <p class="status">Scanning this page…</p>
    </main>
    <footer>
      <div class="selection-status">
        <strong id="selection-summary">Select one video</strong>
        <span id="selection-hint">Captions are optional</span>
      </div>
      <div class="footer-actions">
        <button id="refresh" class="secondary" type="button">Refresh</button>
        <button id="download-selected" type="button" disabled>Download selected</button>
      </div>
    </footer>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
